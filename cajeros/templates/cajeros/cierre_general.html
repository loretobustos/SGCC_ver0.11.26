{% extends 'cajeros/base.html' %}{% block title %}Cierre general | SGCC{% endblock %}{% block content %}<div class="form-card text-center"><div class="login-mark text-danger bg-danger-subtle">!</div><h1 class="h3 fw-bold">Cierre general de jornada</h1><p class="text-secondary">Esta acción dejará inactivas todas las cajas que estén activas o en colación. El evento quedará registrado en la bitácora.</p><form method="post">{% csrf_token %}<div class="d-flex justify-content-center gap-2 mt-4"><button class="btn btn-danger" onclick="return confirm('¿Confirmas el cierre de todas las cajas?')">Confirmar cierre general</button><a class="btn btn-light" href="{% url 'listado_cajeros' %}">Cancelar</a></div></form></div>{% endblock %}
